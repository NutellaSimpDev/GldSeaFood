<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%" opacity="0.95">
  <defs>
    <!-- Map Gradients -->
    <linearGradient id="mapGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(252, 224, 130, 0.4)" />
      <stop offset="100%" stop-color="rgba(212, 175, 55, 0.15)" />
    </linearGradient>
    
    <linearGradient id="mapBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(23, 107, 135, 0.18)" />
      <stop offset="100%" stop-color="rgba(0, 45, 78, 0.06)" />
    </linearGradient>

    <linearGradient id="glowGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FCE082" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9A7B1C" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Deep Ocean Grid Background -->
  <rect width="1000" height="500" fill="transparent"/>
  
  <!-- Ocean Grid Lines for Tech/Corporate Look -->
  <g stroke="rgba(212, 175, 55, 0.05)" stroke-width="0.8">
    <path d="M 0,50 L 1000,50 M 0,100 L 1000,100 M 0,150 L 1000,150 M 0,200 L 1000,200 M 0,250 L 1000,250 M 0,300 L 1000,300 M 0,350 L 1000,350 M 0,400 L 1000,400 M 0,450 L 1000,450" />
    <path d="M 100,0 L 100,500 M 200,0 L 200,500 M 300,0 L 300,500 M 400,0 L 400,500 M 500,0 L 500,500 M 600,0 L 600,500 M 700,0 L 700,500 M 800,0 L 800,500 M 900,0 L 900,500" />
  </g>

  <!-- HIGH FIDELITY GEOGRAPHICAL PATHS (NATURAL AND DETAILED COASTLINES) -->
  <g id="continents">
    <!-- North America (High Fidelity - Jagged Natural Coastlines) -->
    <path d="M 45,65 L 50,60 L 45,55 L 52,48 L 60,52 L 68,48 L 65,40 L 72,40 L 78,35 L 85,38 L 92,34 L 100,38 L 105,32 L 112,35 L 120,40 L 125,32 L 132,32 L 138,40 L 145,35 L 152,38 L 160,32 L 168,36 L 175,25 L 182,28 L 188,32 L 195,30 L 205,32 L 210,48 L 222,42 L 235,55 L 242,52 L 248,58 L 255,54 L 265,58 L 262,68 L 258,72 L 262,88 L 270,95 L 285,115 L 278,122 L 265,118 L 260,128 L 252,132 L 255,145 L 245,152 L 242,165 L 245,178 L 252,182 L 258,175 L 260,188 L 252,195 L 248,192 L 240,205 L 242,218 L 235,225 L 238,235 L 225,248 L 220,248 L 212,242 L 208,235 L 212,228 L 202,225 L 195,212 L 188,218 L 175,215 L 172,202 L 160,198 L 155,188 L 145,185 L 138,172 L 125,168 L 112,158 L 102,162 L 92,152 L 88,138 L 95,122 L 82,118 L 72,102 L 68,88 L 75,82 L 78,68 L 88,62 Z" 
          fill="url(#mapGold)" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1.2" />

    <!-- Florida Detail -->
    <path d="M 245,178 L 248,188 L 250,192 L 253,195 L 255,190 L 254,182 Z" 
          fill="url(#mapGold)" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1.2" />

    <!-- Greenland (Detailed) -->
    <path d="M 280,25 L 305,20 L 335,28 L 340,42 L 320,68 L 298,82 L 285,78 L 272,60 L 275,45 Z" 
          fill="rgba(212, 175, 55, 0.08)" stroke="rgba(212, 175, 55, 0.15)" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Caribbean Islands Details -->
    <path d="M 265,198 Q 275,202 285,208 M 260,210 Q 270,215 278,218" 
          fill="none" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1.5" />

    <!-- Central America (Detailed Natural Isthmus) -->
    <path d="M 220,248 L 223,252 L 226,256 L 230,255 L 235,258 L 238,262 L 242,266 L 246,268 L 244,272 L 248,276 L 252,280 L 255,288 L 260,286 L 265,285 L 270,292 L 275,295 L 270,298 L 265,295 L 260,292 L 255,290 L 250,285 L 245,278 L 238,272 L 232,268 L 225,262 L 218,255 Z" 
          fill="url(#mapGold)" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1.2" />

    <!-- South America (HIGH FIDELITY NATURAL COASTLINE - NO MORE DEFORMATIONS) -->
    <path d="M 275,295 L 280,291 L 286,290 L 292,291 L 298,294 L 304,297 L 310,300 L 316,303 L 322,305 L 328,304 L 333,307 L 337,311 L 342,316 L 346,321 L 350,327 L 355,334 L 360,342 L 363,350 L 366,358 L 368,367 L 371,376 L 370,384 L 366,391 L 362,398 L 357,405 L 351,412 L 345,419 L 339,426 L 333,433 L 328,440 L 322,447 L 316,454 L 310,461 L 304,468 L 298,474 L 292,481 L 286,487 L 280,493 L 276,498 L 274,498 L 272,492 L 274,484 L 275,476 L 273,468 L 271,460 L 269,453 L 267,446 L 264,439 L 261,432 L 258,425 L 255,418 L 251,411 L 247,404 L 243,397 L 239,390 L 236,383 L 233,376 L 231,369 L 233,362 L 236,355 L 239,348 L 237,341 L 239,334 L 242,327 L 245,320 L 249,313 L 254,307 L 260,302 L 267,298 Z" 
          fill="url(#mapGold)" stroke="rgba(212, 175, 55, 0.45)" stroke-width="1.3" />

    <!-- Falkland Islands Detail -->
    <circle cx="295" cy="485" r="2.5" fill="url(#mapGold)" stroke="rgba(212, 175, 55, 0.4)" stroke-width="0.5" />
    <circle cx="302" cy="482" r="1.8" fill="url(#mapGold)" stroke="rgba(212, 175, 55, 0.4)" stroke-width="0.5" />

    <!-- Europe & Great Britain (Faint Detailed Representation) -->
    <path d="M 440,65 L 452,58 L 468,52 L 485,55 L 502,48 L 522,58 L 545,62 L 555,75 L 565,95 L 558,110 L 542,122 L 532,135 L 522,142 L 512,138 L 500,145 L 488,142 L 478,148 L 465,145 L 455,135 L 452,122 L 442,118 L 438,105 L 440,90 Z" 
          fill="url(#mapBlue)" stroke="rgba(23, 107, 135, 0.25)" stroke-width="1" />
    <path d="M 425,78 L 430,70 L 435,75 L 430,85 Z M 418,92 L 422,88 L 425,95 L 420,102 Z" 
          fill="url(#mapBlue)" stroke="rgba(23, 107, 135, 0.2)" stroke-width="0.8" />

    <!-- Africa (Faint Detailed Representation) -->
    <path d="M 452,220 C 475,208 505,212 532,228 C 555,242 575,262 588,285 C 598,308 605,335 598,360 C 590,385 572,408 555,428 C 538,445 520,460 502,475 C 495,480 488,485 485,488 L 482,488 L 480,475 C 475,455 470,432 468,410 C 465,385 455,360 448,335 C 440,310 435,285 432,260 C 428,245 440,230 452,220 Z" 
          fill="url(#mapBlue)" stroke="rgba(23, 107, 135, 0.25)" stroke-width="1" />
  </g>

  <!-- High-Tech Route Arc Connections -->
  <g fill="none" stroke-linecap="round">
    <!-- Peru to Mexico Route -->
    <path d="M 280,380 Q 235,280 230,170" stroke="url(#glowGold)" stroke-width="2.2" stroke-dasharray="6,4" />
    
    <!-- Colombia to Costa Rica and Mexico -->
    <path d="M 275,290 Q 255,270 245,260" stroke="url(#glowGold)" stroke-width="1.8" />
    <path d="M 245,260 Q 235,210 230,170" stroke="url(#glowGold)" stroke-width="1.8" />

    <!-- Dual Ocean Global Trade routes faint arcs -->
    <path d="M 275,290 Q 380,240 500,140" stroke="rgba(212, 175, 55, 0.15)" stroke-width="1.2" stroke-dasharray="5,5" />
    <path d="M 230,170 Q 350,110 480,100" stroke="rgba(212, 175, 55, 0.12)" stroke-width="1" stroke-dasharray="5,5" />
  </g>

  <!-- Interactive visual anchor indicator rings linking operational nodes -->
  <g fill="#D4AF37" opacity="0.85">
    <circle cx="230" cy="170" r="3.5" /> <!-- Mexico -->
    <circle cx="245" cy="260" r="3.5" /> <!-- Costa Rica -->
    <circle cx="275" cy="290" r="3.5" /> <!-- Colombia -->
    <circle cx="280" cy="380" r="3.5" /> <!-- Peru -->
  </g>
</svg>
