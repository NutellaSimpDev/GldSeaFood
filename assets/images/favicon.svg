<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Deep Ocean Gradient -->
    <radialGradient id="marineBg" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#003554" />
      <stop offset="70%" stop-color="#001C30" />
      <stop offset="100%" stop-color="#000B14" />
    </radialGradient>
    
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#9A7B1C" />
    </linearGradient>
    
    <!-- Outer Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#D4AF37" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Deep Ocean Circular Background -->
  <circle cx="64" cy="64" r="60" fill="url(#marineBg)" stroke="url(#goldFav)" stroke-width="3" filter="url(#goldGlow)" />
  
  <!-- Subtle inner marine grid accent -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(212, 175, 55, 0.15)" stroke-width="0.75" stroke-dasharray="3,3" />

  <!-- Stylized Jumping Gold Fish Emblem (Derived from the real logo) -->
  <g transform="translate(14, 12) scale(1.15)">
    <!-- Leaping Arch Semicircle -->
    <path d="M 12,58 A 30,30 0 0,1 72,50" fill="none" stroke="url(#goldFav)" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.8" />
    
    <!-- Gold Fish Body -->
    <path d="M 15,55 C 20,38 32,26 46,26 C 50,26 56,29 62,34 C 57,36 52,39 50,44 C 47,51 51,59 59,61 C 51,61 43,59 36,54 C 30,49 23,51 15,55 Z" fill="url(#goldFav)" filter="url(#goldGlow)" />
    
    <!-- Fin Details -->
    <path d="M 11,56 C 7,58 3,62 0,67 C 4,64 9,63 13,62 C 12,60 12,58 11,56 Z" fill="url(#goldFav)" />
    <path d="M 40,26 C 43,20 47,16 52,13 C 50,17 48,22 45,26 Z" fill="url(#goldFav)" />
    
    <!-- Accent Wave Line -->
    <path d="M 0,66 C 16,62 24,72 44,70 C 60,68 70,61 80,64" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 5,71 C 18,68 26,76 44,74 C 58,72 66,67 74,69" fill="none" stroke="url(#goldFav)" stroke-width="0.75" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
